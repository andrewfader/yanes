name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libx11-dev libxft-dev

      - name: Configure CMake
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage"

      - name: Build
        run: cmake --build build-ci --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build-ci -C Release --output-on-failure

      - name: Stage plugin and tools
        run: cmake --install build-ci --config Release

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: YANES-${{ matrix.artifact }}
          path: stage/
          if-no-files-found: error
          retention-days: 14
