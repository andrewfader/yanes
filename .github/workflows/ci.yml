name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
            build_furnace: true
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            build_furnace: false
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
            build_furnace: false
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64
            build_furnace: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libx11-dev libxft-dev \
            libsndfile1-dev libfftw3-dev libfmt-dev zlib1g-dev
          # libsdl2-dev is intentionally not installed: the Furnace build below
          # uses -DBUILD_GUI=OFF -DUSE_SDL2=OFF, so SDL2 is not linked.

      - name: Build Furnace (Linux only)
        # Furnace is built from source on Linux so the envelope oracle and the
        # 21-chip audio parity suite can run against the upstream reference
        # engine. The build is headless (-DBUILD_GUI=OFF) and uses system audio
        # backends, so the CI image's default libs are enough — no
        # SDL2/PortAudio/JACK needed at runtime. Other platforms are skipped:
        # their toolchains need different setup (MSVC vcpkg on Windows,
        # Homebrew on macOS) and the oracle tests are already covered on
        # Linux where the regression signal matters.
        #
        # Uses the latest upstream master; the .fur fixtures under
        # tests/furnace/ must be regenerated against the same commit whenever
        # the chip models change (run tools/regen_furnace_fixtures.sh with
        # FURNACE_SRC pointing at a matching checkout).
        if: matrix.build_furnace
        run: |
          set -e
          FURNACE_SHA=$(git ls-remote https://github.com/tildearrow/furnace.git HEAD | awk '{print $1}')
          echo "Furnace HEAD = $FURNACE_SHA"
          rm -rf "$RUNNER_TEMP/furnace-bin"
          git clone --no-single-branch --recurse-submodules \
            https://github.com/tildearrow/furnace.git "$RUNNER_TEMP/furnace"
          cd "$RUNNER_TEMP/furnace"
          git checkout "$FURNACE_SHA"
          cmake -S . -B build \
            -DBUILD_GUI=OFF \
            -DUSE_SDL2=OFF \
            -DWITH_RENDER_OPENGL=OFF \
            -DWITH_RENDER_OPENGL1=OFF \
            -DWITH_RENDER_METAL=OFF \
            -DWITH_RENDER_DX11=OFF \
            -DWITH_RENDER_DX9=OFF \
            -DWITH_RENDER_SDL=OFF \
            -DUSE_FREETYPE=OFF \
            -DWITH_JACK=OFF \
            -DWITH_PORTAUDIO=OFF \
            -DUSE_RTMIDI=OFF \
            -DSYSTEM_LIBSNDFILE=ON \
            -DSYSTEM_FFTW=ON \
            -DSYSTEM_FMT=ON \
            -DSYSTEM_ZLIB=ON \
            -DWITH_OGG=OFF \
            -DWITH_MPEG=OFF \
            -DWITH_LOCALE=OFF \
            -DUSE_MOMO=OFF \
            -DWITH_DEMOS=OFF \
            -DWITH_INSTRUMENTS=OFF \
            -DWITH_WAVETABLES=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target furnace --parallel $(nproc)
          mkdir -p "$GITHUB_WORKSPACE/build-ci"
          cp build/furnace "$GITHUB_WORKSPACE/build-ci/furnace"

      - name: Configure CMake
        run: cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage" -DYANES_FURNACE_EXECUTABLE="${{ github.workspace }}/build-ci/furnace"

      - name: Build
        run: cmake --build build-ci --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build-ci -C Release --output-on-failure

      - name: Stage plugin and tools
        run: cmake --install build-ci --config Release

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: YANES-${{ matrix.artifact }}
          path: stage/
          if-no-files-found: error
          retention-days: 14
