name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# The reference engines the Linux job scores YANES against. Pinned so a red run
# always means a YANES change, not an upstream one; bump a SHA (and rerun the
# suite locally, see FURNACE_PARITY.md) to move to a newer upstream.
env:
  FURNACE_REF: fa9541db8004fcdab92808ef57779cd0249e451f
  SAMEBOY_REF: 213a12ce93d66b105a113debd9396306066a7cfc

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
          - name: macOS Apple Silicon
            os: macos-15
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # The last four are Furnace's system libraries (headless build below).
          sudo apt-get install -y build-essential cmake pkg-config libx11-dev libxft-dev \
            libsndfile1-dev libfftw3-dev libfmt-dev zlib1g-dev

      # Furnace is the reference for the 63-fixture chip-audio suite (timbre,
      # pitch and envelope). Built headless once per pinned commit and cached.
      - name: Restore Furnace
        id: furnace-cache
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/furnace-bin
          key: furnace-${{ runner.os }}-${{ env.FURNACE_REF }}-v1

      - name: Build Furnace
        if: runner.os == 'Linux' && steps.furnace-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          src="$RUNNER_TEMP/furnace-src"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/tildearrow/furnace.git "$FURNACE_REF"
          git -C "$src" checkout -q FETCH_HEAD
          git -C "$src" submodule update -q --init --depth 1 --recursive
          # Upstream sources lean on transitive <climits>/<cstring> includes that
          # current libstdc++ no longer provides.
          cmake -S "$src" -B "$src/build" -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF -DUSE_SDL2=OFF -DUSE_FREETYPE=OFF -DUSE_RTMIDI=OFF -DUSE_MOMO=OFF \
            -DWITH_RENDER_OPENGL=OFF -DWITH_RENDER_OPENGL1=OFF -DWITH_RENDER_METAL=OFF \
            -DWITH_RENDER_DX11=OFF -DWITH_RENDER_DX9=OFF -DWITH_RENDER_SDL=OFF \
            -DWITH_JACK=OFF -DWITH_PORTAUDIO=OFF -DWITH_OGG=OFF -DWITH_MPEG=OFF -DWITH_LOCALE=OFF \
            -DWITH_DEMOS=OFF -DWITH_INSTRUMENTS=OFF -DWITH_WAVETABLES=OFF \
            -DSYSTEM_LIBSNDFILE=ON -DSYSTEM_FFTW=ON -DSYSTEM_FMT=ON -DSYSTEM_ZLIB=ON \
            "-DCMAKE_CXX_FLAGS=-include climits -include cstring"
          cmake --build "$src/build" --target furnace --parallel "$(nproc)"
          mkdir -p "$RUNNER_TEMP/furnace-bin"
          cp "$src/build/furnace" "$RUNNER_TEMP/furnace-bin/furnace"

      # SameBoy is the reference for the Game Boy envelope lane. CMake compiles
      # its core from this checkout, so only the source is needed.
      - name: Fetch SameBoy
        if: runner.os == 'Linux'
        run: |
          set -e
          src="$RUNNER_TEMP/sameboy"
          git init -q "$src"
          git -C "$src" fetch -q --depth 1 https://github.com/LIJI32/SameBoy.git "$SAMEBOY_REF"
          git -C "$src" checkout -q FETCH_HEAD
          git -C "$src" apply "$GITHUB_WORKSPACE/third_party/sameboy-apu-register-log.patch"

      - name: Configure CMake
        shell: bash
        run: |
          oracles=()
          if [ "$RUNNER_OS" = Linux ]; then
            oracles=(-DYANES_FURNACE_EXECUTABLE="$RUNNER_TEMP/furnace-bin/furnace"
                     -DYANES_SAMEBOY_SRC="$RUNNER_TEMP/sameboy")
          fi
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/stage" "${oracles[@]}"

      - name: Build
        run: cmake --build build-ci --config Release --parallel 2

      - name: Run tests
        run: ctest --test-dir build-ci -C Release --output-on-failure

      - name: Stage plugin and tools
        run: cmake --install build-ci --config Release

      - name: Upload unsigned build
        uses: actions/upload-artifact@v4
        with:
          name: YANES-${{ matrix.artifact }}
          path: stage/
          if-no-files-found: error
          retention-days: 14
